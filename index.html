        async function generateEncryptedWallet() {
            const name = document.getElementById('onb-name').value.trim();
            const email = document.getElementById('onb-email').value.trim();
            const password = document.getElementById('onb-password').value;

            if (!name || !email || password.length < 8) {
                alert("Please fill in all fields. Password must be at least 8 characters.");
                return;
            }

            const walletAddress = 'DDN_' + Array.from({length: 16}, () => Math.floor(Math.random()*16).toString(16)).join('');
            const seedArr = [];
            for (let i = 0; i < 12; i++) {
                seedArr.push(SEED_WORDS[Math.floor(Math.random() * SEED_WORDS.length)]);
            }
            const seedPhrase = seedArr.join(' ');

            try {
                const enc = new TextEncoder();
                const salt = window.crypto.getRandomValues(new Uint8Array(16));
                const iv = window.crypto.getRandomValues(new Uint8Array(12));

                const keyMaterial = await window.crypto.subtle.importKey(
                    "raw",
                    enc.encode(password),
                    { name: "PBKDF2" },
                    false,
                    ["deriveKey"]
                );

                const key = await window.crypto.subtle.deriveKey(
                    {
                        name: "PBKDF2",
                        salt: salt,
                        iterations: 100000,
                        hash: "SHA-256"
                    },
                    keyMaterial,
                    { name: "AES-GCM", length: 256 },
                    true,
                    ["encrypt", "decrypt"]
                );

                const encryptedContent = await window.crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    enc.encode(seedPhrase)
                );

                const backupObject = {
                    wallet: walletAddress,
                    email: email,
                    salt: Array.from(salt),
                    iv: Array.from(iv),
                    ciphertext: Array.from(new Uint8Array(encryptedContent))
                };
                const backupBlobString = JSON.stringify(backupObject, null, 2);

                generatedWalletData = {
                    name, email, password, wallet: walletAddress, seedPhrase, backupBlobString
                };

                let users = JSON.parse(localStorage.getItem('ddn_users') || '[]');
                if (!users.some(u => u.email === email)) {
                    users.push({name, email, password, wallet: walletAddress, balance: 150});
                    localStorage.setItem('ddn_users', JSON.stringify(users));
                }

                localStorage.setItem('ddn_encrypted_wallet', backupBlobString);

                document.getElementById('onb-wallet-output').innerText = walletAddress;
                document.getElementById('onb-seed-output').innerText = seedPhrase;
                document.getElementById('onb-blob-output').value = backupBlobString;

                document.getElementById('onb-result').classList.remove('hidden');
                document.getElementById('step2-container').classList.remove('hidden');

                alert("Wallet and encrypted seed successfully generated!");
            } catch (err) {
                console.error(err);
                alert("Encryption failed: " + err.message);
            }
        }

                const salt = new Uint8Array(data.salt);
                const iv = new Uint8Array(data.iv);
                const ciphertext = new Uint8Array(data.ciphertext);

                const keyMaterial = await window.crypto.subtle.importKey(
                    "raw",
                    enc.encode(pass),
                    { name: "PBKDF2" },
                    false,
                    ["deriveKey"]
                );

                const key = await window.crypto.subtle.deriveKey(

                        salt: salt,
                        iterations: 100000,
                        hash: "SHA-256"
                    },
                    keyMaterial,
                    { name: "AES-GCM", length: 256 },
                    true,
                    ["encrypt", "decrypt"]
                );

                const decrypted = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    ciphertext
                );

                const decoder = new TextDecoder();
                const seed = decoder.decode(decrypted);

            const maxMint = grams / 0.0870;
            maxMintOutput.innerText = maxMint.toFixed(2) + ' DDN';
        }

        function executeMultiSigMint() {
            const grams = parseFloat(document.getElementById('creator-gold-grams').value);
            const certHash = document.getElementById('creator-cert-hash').value.trim();
            const password = document.getElementById('creator-admin-password').value;
            const logBox = document.getElementById('creator-mint-log');
            logBox.classList.remove('hidden');

            if (isNaN(grams) || grams <= 0 || !certHash || !password) {
                logBox.innerHTML = '<span class="text-red-400 font-bold">❌ Validation Failed: All fields (Gold Grams > 0, Cert Hash, Admin Password) are required.</span>';
                return;
            }

            const maxMint = grams / 0.0870;
            const txHash = '0x' + Array.from({length: 32}, () => Math.floor(Math.random()*16).toString(16)).join('');

            logBox.innerHTML = `
                <div class="text-emerald-400 font-bold">✅ Multi-Sig Mint Executed Successfully (3-of-5 Approvals)</div>
                <div>PoR Status: <span class="text-gold-400">SIMULATED - Gold Reserves Verified</span></div>
                <div>Minted Amount: <span class="text-gold-400">${maxMint.toFixed(2)} DDN</span></div>
                <div>Transaction Hash: <span class="text-zinc-300">${txHash}</span></div>
            `;
        }

        function sendCreatorInvitation() {
            const email = document.getElementById('invitation-email').value.trim();
            if (!email) {
                alert("Please enter a valid email address.");
                return;
            }
            alert(`Creator invitation successfully dispatched to ${email}`);
        }
    </script>
</body>
</html>
